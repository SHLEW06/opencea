[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencea"
version = "0.1.1"
description = "Open, reproducible health-economic decision modeling in Python — validated cohort state-transition CEA with PSA, DSA, CEAC, and an applied case study."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shunji Lewandowski" }]
keywords = [
    "health-economics",
    "cost-effectiveness",
    "markov-model",
    "cohort-model",
    "qaly",
    "psa",
    "dsa",
    "ceac",
    "hta",
    "decision-modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "build==1.5.0",
    "twine==6.2.0",
    "readme-renderer[md]==45.0",
    "comrak==0.0.15",
    "ruff==0.15.21",
    "pre-commit==4.6.1",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    "tomli==2.4.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/SHLEW06/OpenCEA"
Repository = "https://github.com/SHLEW06/OpenCEA"
Issues = "https://github.com/SHLEW06/OpenCEA/issues"
Changelog = "https://github.com/SHLEW06/OpenCEA/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencea = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
# Keep the intended rules explicit so a Ruff default change cannot expand
# the release gate. The exact Ruff version is pinned in the dev extra,
# pre-commit, and CI.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.coverage.run]
source_pkgs = ["opencea"]

[tool.coverage.report]
# Measured baseline at adoption (2026-07-13): 95%. Threshold set with
# headroom so honest refactors don't fail CI on a fraction of a percent.
fail_under = 90
show_missing = true

[tool.mypy]
# Source remains Python 3.10 compatible. Type checking runs on the CI
# baseline (3.12) because current NumPy stubs use Python 3.12 syntax.
python_version = "3.12"
files = ["src/opencea"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas"]
# pandas does not ship inline type information. Keep this exception limited
# to that dependency rather than suppressing missing imports project-wide.
ignore_missing_imports = true
