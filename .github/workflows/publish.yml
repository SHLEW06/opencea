name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC): no API token stored in the repo.
# See docs/PUBLISHING.md for one-time PyPI setup.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish opencea to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/opencea

    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Verify release tag
        run: >-
          python -c "import os, tomllib;
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          actual = os.environ['GITHUB_REF_NAME'];
          expected = f'v{version}';
          assert actual == expected, f'release tag {actual!r} does not match {expected!r}'"

      - name: Run release checks
        env:
          MPLBACKEND: Agg
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
          python -m mypy src/opencea
          python -m pytest --cov

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py dist

      - name: Install and smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/opencea-wheel"
          "$RUNNER_TEMP/opencea-wheel/bin/python" -m pip install --upgrade "pip==26.1.2"
          "$RUNNER_TEMP/opencea-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/opencea-*.whl
          "$RUNNER_TEMP/opencea-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/opencea-wheel/bin/python" "$GITHUB_WORKSPACE/examples/installed_smoke.py"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
